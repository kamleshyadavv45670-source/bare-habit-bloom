name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
          sdkmanager --list_installed

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Fix Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Generate versioned artifact names
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bare-habit-bloom-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode release signing keystore
        if: secrets.SIGNING_KEY_BASE64 != ''
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Apply release signing config
        if: secrets.SIGNING_KEY_BASE64 != ''
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              text = f.read()

          signing_block = '''
          signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''

          # Insert signingConfigs after the first android { line
          text = re.sub(r"(\s*android\s*\{\s*\n)", r"\1" + signing_block, text, count=1)

          # Update release buildType to use the signing config
          text = re.sub(
              r"(buildTypes\s*\{[^}]*release\s*\{)([^}]*minifyEnabled[^}]*?)(\})",
              r"\1\2\n            signingConfig signingConfigs.release\n        }",
              text,
              flags=re.DOTALL,
          )

          with open(path, "w") as f:
              f.write(text)
          print("Updated android/app/build.gradle with release signing config")
          PYEOF

      - name: Build Release APK
        if: secrets.SIGNING_KEY_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload Release APK
        if: secrets.SIGNING_KEY_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: bare-habit-bloom-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
